[project]
name = "bigrag"
version = "2026.4.30"
description = "Self-hostable RAG platform with Docling ingestion and Turbopuffer vector storage"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0,<1",
    "starlette>=1.10.0,<2",
    "uvicorn[standard]>=0.54.0,<1",
    "asyncpg>=0.32.0,<1",
    "sqlalchemy[asyncio]>=2.1.9,<3",
    "alembic>=1.20.1,<2",
    "docling>=2.154.0,<3",
    "pypdfium2>=5.15.2,<6",
    "huggingface-hub>=1.33.0,<2",
    "openai>=2.54.0,<3",
    "cohere>=7.3.2,<8",
    "pydantic>=2.14.4,<3",
    "pydantic-settings>=2.16.3,<3",
    "python-multipart>=0.0.34,<1",
    "httpx>=0.29.0,<1",
    "redis[hiredis]>=8.2.0,<9",
    "orjson>=3.13.0,<4",
    "structlog>=26.1.0,<27",
    "argon2-cffi>=25.1.0,<26",
    "cryptography>=50.0.2,<51",
    "boto3>=1.44.12,<2",
    "mcp>=1.30.0,<2",
    "tiktoken>=0.14.0,<1",
    "dramatiq[redis]>=2.2.1,<3",
    "turbopuffer>=2.14.0,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[project.scripts]
bigrag = "bigrag.main:cli"
bigrag-mcp = "bigrag.mcp:cli"
bigrag-reencrypt = "bigrag.services.reencrypt:cli"
bigrag-worker = "bigrag.worker:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bigrag"]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "bigrag/_alembic"
"alembic.ini" = "bigrag/_alembic/alembic.ini"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "T201", "FA102"]
ignore = ["B008"]  # Depends() and Query() in FastAPI defaults are intentional
